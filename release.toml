# cargo-release configuration — see doc/specs/codeforge-release-pipeline.md
# Driven by `cargo release patch --execute` from a clean main.

pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
tag-name = "v{{version}}"
tag-message = "codeforge v{{version}}"

# Binary is the product. Do not auto-publish to crates.io.
publish = false

# Leave push manual until the release pipeline has been validated end-to-end.
# Flip to `true` once a v0.0.2 release has landed and been verified.
push = false
