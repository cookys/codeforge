[package]
name = "codeforge"
version = "0.0.5"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Claude Code power-user toolkit — memory management + gamification"
authors = ["cookys"]
repository = "https://github.com/cookys/codeforge"
readme = "README.md"
keywords = ["cli", "claude", "memory", "gamification", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codeforge"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Internationalization
rust-i18n = "3"
sys-locale = "0.3"

# Terminal colors
owo-colors = { version = "4", features = ["supports-colors"] }
unicode-width = "0.2"
crossterm = "0.29"

# Async runtime (for dream compile LLM calls)
tokio = { version = "1", features = ["full"] }

# ECS — daemon game state (Phase 2a P3)
hecs = "0.10"

# HTTP client (for Claude Agent SDK in dream compile)
# rustls-tls (not the default native-tls) — pure-Rust TLS so it cross-compiles
# to aarch64-linux without an openssl-sys C build, and shares the rustls/ring
# stack with self_update below (single TLS stack across the binary).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async trait (CodePower `ClanContentProvider` mirror)
async-trait = "0.1"

# Config file parsing (`~/.codeforge/config.toml`)
toml = "0.8"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID for signal IDs
uuid = { version = "1", features = ["v4"] }

# ULID for Mnemos ship_id / cite_id idempotency keys (26-char Crockford base32)
ulid = "1"

# SHA-1 for Phase 3c commentary phrase dedup keys (hex-encoded, persisted)
sha1 = "0.10"

# Environment
dotenvy = "0.15"
# self-update: ureq+rustls backend (not the default reqwest backend, whose
# reqwest 0.13 req would pull a second reqwest alongside our 0.12). Shares the
# rustls/ring TLS stack with reqwest above — one TLS stack, no openssl-sys.
self_update = { version = "0.44.0", default-features = false, features = ["archive-tar", "compression-flate2", "rustls", "ureq"] }

[dev-dependencies]
tempfile = "3"
# test-util: tokio 虛擬時鐘(start_paused),讓 backoff retry 測試不真的等 1s/5s/30s。
tokio = { version = "1", features = ["test-util"] }

# Release distribution — see doc/specs/codeforge-release-pipeline.md
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/codeforge-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "codeforge-{ version }-{ target }/{ bin }{ binary-ext }"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
