[package]
name = "codeforge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Claude Code power-user toolkit — memory management + gamification"

[[bin]]
name = "codeforge"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Terminal colors
termcolor = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
unicode-width = "0.2"
crossterm = "0.29"

# Async runtime (for dream compile LLM calls)
tokio = { version = "1", features = ["full"] }

# HTTP client (for Claude Agent SDK in dream compile)
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID for signal IDs
uuid = { version = "1", features = ["v4"] }

# Environment
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
