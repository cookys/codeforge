name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build all targets but do not publish to a release'
        required: false
        default: 'true'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Assemble tarball
        shell: bash
        run: |
          set -euo pipefail
          v=${{ steps.ver.outputs.version }}
          t=${{ matrix.target }}
          dir="codeforge-${v}-${t}"
          mkdir -p "dist/${dir}"
          cp "target/${t}/release/codeforge" "dist/${dir}/codeforge"
          chmod +x "dist/${dir}/codeforge"
          cp README.md LICENSE "dist/${dir}/"
          # Strip
          if [ "${{ matrix.cross }}" = "true" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip "dist/${dir}/codeforge" || true
          else
            strip "dist/${dir}/codeforge" || true
          fi
          (cd dist && tar czf "${dir}.tar.gz" "${dir}")
          # SHA256
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256")
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-${{ steps.ver.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    # Only on real tag push, not dry-run
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
