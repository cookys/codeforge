name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Format via the pinned wrapper — NOT a bare `cargo fmt`. The script is the
      # single source of the rustfmt toolchain version and self-installs it, so
      # CI formats byte-identically to every machine + agent. ubuntu runners
      # ship rustup, which the script uses to install the pinned toolchain.
      - name: Check formatting (pinned via scripts/fmt.sh)
        run: ./scripts/fmt.sh --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  doc-drift:
    name: doc-drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docdrift-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (for CLI-surface check)
        run: cargo build
      - name: Deterministic doc-drift gate
        run: python3 scripts/check-doc-drift.py

  cjk-safe:
    name: cjk-safe gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CJK-safe string-slice gate
        run: ./scripts/check-cjk-safe.sh
